name: Build
on:
  workflow_call:
    inputs:
      ref:
        description: 'Full commit sha to build (never a branch or tag name)'
        required: true
        type: string
      version-name:
        description: 'Expected versionName; empty reads app/build.gradle.kts'
        required: false
        default: ''
        type: string
      abis:
        description: 'Comma-separated ABI list for -Pcsqtt.abis'
        required: false
        default: 'arm64-v8a,armeabi-v7a,x86_64'
        type: string
      expected-version-code:
        description: 'Expected versionCode; empty reads app/build.gradle.kts'
        required: false
        default: ''
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64: { required: true }
      ANDROID_KEYSTORE_PASSWORD: { required: true }
      ANDROID_KEY_ALIAS: { required: true }
      ANDROID_KEY_PASSWORD: { required: true }
      ANDROID_KEYSTORE_FINGERPRINT: { required: true }
    outputs:
      version:      { description: 'versionName the APKs were built with', value: "${{ jobs.build.outputs.version }}" }
      commit:       { description: 'Full sha that was built',              value: "${{ jobs.build.outputs.commit }}" }
      signer-cn:    { description: 'Signing certificate CN',               value: "${{ jobs.build.outputs.signer-cn }}" }
      artifact-name: { description: 'Run artifact with apk/ and assets/',  value: "${{ jobs.build.outputs.artifact-name }}" }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      signer-cn: ${{ steps.signcheck.outputs.cn }}
      artifact-name: release-assets-${{ steps.version.outputs.version }}
    steps:
      # Глубина 1 достаточна: ни provenance-скрипты, ни сборка не читают
      # git-историю. `release-note.sh` остаётся у вызывающего и работает на
      # своём полном checkout.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      # Идёт ПЕРЕД Setup Java/Python: /opt/hostedtoolcache — это RUNNER_TOOL_CACHE,
      # и удаление после setup-java оставило бы висячий JAVA_HOME (sdkmanager и
      # Gradle падали бы). ubuntu-24.04 даёт ~14 ГБ SSD, а холодный прогон тянет
      # SDK+NDK, три cargo-таргета и Gradle-кэши — риск No space left on device
      # реальный. Свой SDK ставим в $HOME/android-sdk, поэтому предустановленный
      # /usr/local/lib/android не нужен; dotnet в этом job не используется.
      # df -h / печатается для диагностики, если места не хватит.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/dotnet || true
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'

      # SDK/NDK кешируются в ~/android-sdk: восстановленный каталог превращает
      # установку в быстрые no-op проверки (лицензии и пакеты уже на месте).
      # Ключ перечисляет все пины, поэтому смена cmdline-tools, build-tools,
      # NDK или platforms не оставит в кеше старый пакет. Пакеты
      # platforms;android-37.0 и build-tools;37.0.0 проверены на живом
      # `sdkmanager --list` — пакета platforms;android-37 не существует
      # (API 37 публикуется в схеме android-37.0).
      # Свой SDK ставим в $HOME/android-sdk, поэтому предустановленный
      # /usr/local/lib/android удаляется шагом Free disk space выше.
      - name: Cache Android SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/android-sdk
          key: android-sdk-${{ runner.os }}-cmd11076708-bt37.0.0-ndk27.0.12077973-platform37.0
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Install Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Восстановленный кеш уже содержит cmdline-tools: скачивание и
          # распаковка не нужны. rm -rf — на случай неполного каталога после
          # прерванного restore.
          if [[ ! -x $SDKM ]]; then
            rm -rf "$ANDROID_HOME/cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          # Конечный ввод вместо `yes`: под `set -o pipefail` SIGPIPE у `yes`
          # (exit 141) уронил бы весь шаг.
          printf 'y\n%.0s' {1..100} | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          # build-tools запинен явно: появление 37.1.0 не должно молча подменить
          # подписывающий/инспектирующий инструмент (apksigner, aapt2).
          BT_VER=37.0.0
          # Динамическим остаётся только cmake: на подпись он не влияет.
          CMAKE_VER=$("$SDKM" --list 2>/dev/null \
            | sed -n 's/^[[:space:]]*cmake;\(3\.[0-9.]*\).*/\1/p' \
            | LC_ALL=C sort -V | tail -1)
          [[ -n $CMAKE_VER ]] || {
            echo "could not resolve cmake version from sdkmanager --list" >&2
            exit 1
          }
          "$SDKM" --sdk_root="$ANDROID_HOME" \
            "platforms;android-37.0" "build-tools;$BT_VER" "ndk;27.0.12077973" "cmake;$CMAKE_VER"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973"
            echo "BT_VER=$BT_VER"
          } >> "$GITHUB_ENV"

      # Тулчейн 1.97.1 с rustfmt/clippy и target'ами качается каждый прогон за
      # ~200 МБ; с восстановленным ~/.rustup `rustup toolchain install` и
      # `rustup target add` становятся no-op. Ключ — хеш rust-toolchain.toml
      # обоих крейтов, чтобы смена пина не оставила в кеше старый toolchain.
      - name: Cache Rust toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-client/rust-toolchain.toml', 'rust-server/rust-toolchain.toml') }}
          restore-keys: |
            rustup-${{ runner.os }}-

      # Версия из rust-toolchain.toml обоих крейтов; явный `toolchain install`
      # делает шаг детерминированным независимо от каталога вызова.
      - name: Install Rust 1.97.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android x86_64-unknown-linux-musl --toolchain 1.97.1
          rustc +1.97.1 --version

      - name: Cache Zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/zig
          key: zig-${{ runner.os }}-0.17.0
          restore-keys: |
            zig-${{ runner.os }}-

      # Fallback при проблемах с 0.17.0: заменить версию на 0.16.0 — больше
      # ничего менять не нужно.
      # Восстановленный ~/zig с нужной версией отменяет скачивание; в
      # $GITHUB_PATH путь добавляется один раз (grep -qxF), иначе строка
      # копилась бы на каждом прогоне.
      - name: Install Zig 0.17.0
        run: |
          set -euo pipefail
          export ZIG_VERSION='0.17.0'
          ZIG_DIR="$HOME/zig"
          if [[ -x "$ZIG_DIR/zig" && "$("$ZIG_DIR/zig" version)" == "$ZIG_VERSION" ]]; then
            echo "zig $ZIG_VERSION уже установлен — установка не требуется"
          else
            # Неполный каталог после прерванной распаковки не должен
            # смешиваться с новой: tar кладёт файлы поверх.
            rm -rf "$ZIG_DIR"
            mkdir -p "$ZIG_DIR"
            cd "$RUNNER_TEMP"
            INDEX=$(curl -fsSL https://ziglang.org/download/index.json)
            URL=$(jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball' <<<"$INDEX")
            SHA=$(jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].shasum' <<<"$INDEX")
            [[ -n $URL && $URL != null && -n $SHA && $SHA != null ]] || {
              echo "could not resolve zig $ZIG_VERSION x86_64-linux tarball/shasum" >&2
              exit 1
            }
            curl -fsSL -o zig.tar.xz "$URL"
            echo "$SHA  zig.tar.xz" | sha256sum -c -
            tar -xJf zig.tar.xz -C "$ZIG_DIR" --strip-components=1
          fi
          echo "ZIG_VERSION=$ZIG_VERSION" >> "$GITHUB_ENV"
          grep -qxF "$ZIG_DIR" "$GITHUB_PATH" || echo "$ZIG_DIR" >> "$GITHUB_PATH"
          # $GITHUB_PATH подействует только со следующего шага — проверяем по пути.
          "$ZIG_DIR/zig" version

      # Кешируем только модули/джарсы/wrapper и билд-кеш Gradle, не весь
      # ~/.gradle/caches: туда попадают cc-keystore и прочее лишнее.
      # gradle.properties входит в ключ: им включается build cache и меняются
      # JVM-параметры, а старый key без него переиспользовал бы чужой кеш.
      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('rust-client/Cargo.lock', 'rust-server/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Версии cargo-ndk/cargo-zigbuild входят в ключ: иначе смена пина не
      # инвалидирует кеш и в ~/.cargo/bin останется старый бинарь.
      - name: Cache Cargo binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '~/.cargo/bin'
          key: cargo-bin-${{ runner.os }}-ndk4.1.2-zigbuild0.24.0-${{ hashFiles('rust-client/Cargo.lock', 'rust-server/Cargo.lock') }}
          restore-keys: |
            cargo-bin-${{ runner.os }}-ndk4.1.2-zigbuild0.24.0-

      - name: Cache Rust client host target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: rust-client/target
          key: cargo-client-target-${{ runner.os }}-${{ hashFiles('rust-client/Cargo.lock', 'rust-client/rust-toolchain.toml') }}
          restore-keys: |
            cargo-client-target-${{ runner.os }}-

      # Каталоги cargo-ndk (build/rust-client-android-<variant>-<abi>) — самая
      # дорогая часть клиентской сборки: без кеша три ABI × два варианта
      # компилируются с нуля. Cargo сам инвалидирует по исходникам и флагам,
      # поэтому кеш ускоряет только неизменённые зависимости; логи
      # (build/rust-client-android-logs) сюда не попадают.
      - name: Cache Rust client Android targets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/rust-client-android-debug-*
            build/rust-client-android-release-*
          key: cargo-client-android-${{ runner.os }}-${{ hashFiles('rust-client/Cargo.lock', 'rust-client/rust-toolchain.toml', 'rust-client/build_android_abis.sh') }}
          restore-keys: |
            cargo-client-android-${{ runner.os }}-

      # Серверный target-dir (release + LTO) и zig-кеши. Имя каталога совпадает
      # с build_linux_variants.sh и rust-server/build_linux.sh: clippy/test и
      # финальная сборка живут в нём же, поэтому шаг Build server binary
      # переиспользует уже собранные зависимости. Безопасно: cargo инвалидирует
      # по исходникам, кеш ускоряет только неизменённые зависимости.
      - name: Cache Rust server target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/csqtt-uring-linux-csqtt-linux-amd64
            build/zig-cache
            ~/.cache/zig
          key: cargo-server-target-${{ runner.os }}-${{ hashFiles('rust-server/Cargo.lock', 'rust-server/rust-toolchain.toml', '.github/scripts/musl-zig-env.sh') }}
          restore-keys: |
            cargo-server-target-${{ runner.os }}-

      # --locked + --version = воспроизводимая установка. `cargo install`
      # отказывается перезаписывать уже существующий бинарь ("binary
      # `cargo-ndk` already exists in destination"), а ~/.cargo/bin лежит в
      # кеше — поэтому на втором прогоне установка падала бы с exit 101.
      # Поэтому: если нужная версия уже на месте, ничего не ставим; если
      # версия другая — переустанавливаем с --force.
      # `cargo-zigbuild --version` вместо `cargo zigbuild --version`: подкоманда
      # `cargo zigbuild` флага --version не принимает (exit 1).
      - name: Install cargo-ndk and cargo-zigbuild
        run: |
          set -euo pipefail
          ensure_cargo_tool() {
            local crate="$1" bin="$2" version="$3"
            # Вывод `cargo-ndk --version` — ровно строка "cargo-ndk <версия>",
            # поэтому сверяем целую строку: подстрока "4.1.2" совпала бы и с
            # "4.1.20".
            if "$bin" --version 2>/dev/null | grep -qxF "$bin $version"; then
              printf '%s %s уже установлен — установка не требуется\n' "$bin" "$version"
              return 0
            fi
            cargo install "$crate" --locked --version "$version" --force
          }
          ensure_cargo_tool cargo-ndk cargo-ndk 4.1.2
          ensure_cargo_tool cargo-zigbuild cargo-zigbuild 0.24.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo ndk --version
          cargo-zigbuild --version

      # Дешёвая проверка падает раньше, чем пятнадцатиминутные гейты: версия
      # и versionCode сверяются с файлом, коммит — с `ref` вызывающего.
      - name: Resolve build version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version-name }}
          INPUT_VERSION_CODE: ${{ inputs.expected-version-code }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          bash .github/scripts/build-version.sh \
            --root "$GITHUB_WORKSPACE" \
            --version-name "${INPUT_VERSION_NAME:-}" \
            --version-code "${INPUT_VERSION_CODE:-}" \
            --expected-commit "${INPUT_REF:-}"

      # Гейты fail-closed: всё проверяемое отсекается до keystore и сборки.
      - name: 'Gate: version consistency'
        run: |
          set -euo pipefail
          bash scripts/check_versions.sh --root .

      # install.sh публикуется ассетом, поэтому его поведение обязано быть
      # зелёным до Kotlin/Rust-сборки. Гейт живёт только здесь: beta и release
      # вызывают shared build.yml, дублировать шаг в них нельзя.
      - name: 'Gate: installer shell tests'
        run: |
          set -euo pipefail
          bash scripts/deploy_shell_tests.sh

      # Фикстуры .github/tests/*.sh существовали, но в CI не запускались:
      # регрессия в release/CI-скриптах ловилась только локально. Прогоняем
      # все и не падаем на первом — иначе за один прогон видна одна поломка.
      # musl-zig-env.sh здесь не хелпер, а section-тест для
      # .github/scripts/musl-zig-env.sh (сам скрипт лишь source'ится изнутри),
      # поэтому он входит в набор наравне с остальными.
      - name: 'Gate: CI and release script fixtures'
        run: |
          set -euo pipefail
          # workflow-skeleton.sh разбирает YAML через PyYAML, а setup-python даёт
          # чистый интерпретатор без сторонних пакетов: без этой строки локально
          # зелёный тест падает в CI на ModuleNotFoundError.
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            python3 -m pip install --quiet --disable-pip-version-check pyyaml
          fi
          python3 -c 'import yaml' >/dev/null
          status=0
          for test in .github/tests/*.sh; do
            printf '▶ %s\n' "$test"
            # env -u: в CI GITHUB_OUTPUT/GITHUB_ENV заданы для каждого шага, и
            # скрипты пишут туда вместо stdout. Фикстуры проверяют stdout, поэтому
            # тест запускается без CI-каналов — иначе локально зелёный падает в CI.
            if ! env -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
                bash "$test"; then
              printf '✗ %s failed\n' "$test" >&2
              status=1
            fi
          done
          exit "$status"

      # Нативную часть не собирает: гейт висит на merge*JniLibFolders.
      - name: 'Gate: Kotlin unit tests'
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest

      # APK — только клиент: серверный бинарник и deploy.sh больше не упаковываются.
      # Гейт по графу зависимостей ловит случайно вернувшийся SSH/BC-клиент.
      # Вывод Gradle сначала сохраняется: `gradle | grep` в `if` глушил бы падение
      # Gradle (pipe + проверка условия), а пустой вывод давал бы ложно-зелёный гейт.
      - name: 'Gate: APK runtime dependencies'
        run: |
          set -euo pipefail
          deps_file="$RUNNER_TEMP/release-runtime-classpath.txt"
          if ! ./gradlew :app:dependencies --configuration releaseRuntimeClasspath -q > "$deps_file"; then
            echo "Gradle не построил граф releaseRuntimeClasspath" >&2
            exit 1
          fi
          if [[ ! -s "$deps_file" ]]; then
            echo "Граф releaseRuntimeClasspath пуст — проверять нечего, гейт не пройден" >&2
            exit 1
          fi
          if grep -Ei 'sshj|bouncycastle|bcprov|bcpkix|bcutil' "$deps_file"; then
            echo "releaseRuntimeClasspath must not contain SSH or BouncyCastle artifacts" >&2
            exit 1
          fi

      - name: 'Gate: Rust client'
        working-directory: rust-client
        run: |
          set -euo pipefail
          bash check_no_runtime_panics.sh
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --quiet

      # Серверный бинарник упаковывался в APK только пока приложение умело
      # разворачивать сервер. Теперь он публикуется отдельным ассетом, поэтому
      # CI собирает его здесь: collect-release-assets.sh у вызывающего читает
      # app/build/generated/assets/csqtt-linux-amd64.
      #
      # --tests: fmt/clippy/test живут в этом же шаге и в том же
      # CARGO_TARGET_DIR, что и сама сборка
      # (build/csqtt-uring-linux-csqtt-linux-amd64), поэтому clippy и zigbuild
      # делят собранные зависимости. Свой CARGO_TARGET_DIR здесь задавать
      # нельзя — он снова развёл бы каталоги и удвоил компиляцию.
      # musl-zig-env.sh даёт cc-rs musl C/C++ (без него cc-rs падает:
      # "failed to find tool x86_64-linux-musl-g++"); cargo-zigbuild ставит
      # свои обёртки только при отсутствии переменных (add_env_if_missing),
      # поэтому линкер посреди прогона не меняется.
      # LC_ALL=C: вывод cargo (а позже keytool) локализуется, а парсеры английские.
      # Шаг стоит до keystore: серверной сборке подпись не нужна, а падать она
      # должна раньше, чем тратится время на APK.
      - name: Build server binary
        working-directory: rust-server
        run: |
          set -euo pipefail
          export LC_ALL=C
          # shellcheck source=../.github/scripts/musl-zig-env.sh
          source ../.github/scripts/musl-zig-env.sh
          bash build_linux.sh --tests

      # Пароль идёт через env, а не argv: verify-signing-identity.sh передаёт
      # keytool `-storepass:env`, поэтому секрет не всплывает даже при
      # ACTIONS_STEP_DEBUG. Флага пути к константе в вызове нет — скрипт сам
      # читает scripts/release_signing_fingerprint.txt из корня репозитория,
      # то есть тройная сверка (keytool <-> константа <-> секрет) выполняется
      # ещё до сборки. LC_ALL=C: парсится вывод keytool.
      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FINGERPRINT: ${{ secrets.ANDROID_KEYSTORE_FINGERPRINT }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          bash .github/scripts/verify-signing-identity.sh \
            --keystore "$RUNNER_TEMP/release.keystore" \
            --storepass-env ANDROID_KEYSTORE_PASSWORD \
            --alias "$ANDROID_KEY_ALIAS" \
            --expected-fingerprint "$ANDROID_KEYSTORE_FINGERPRINT"

      # Имена env — ровно те, что читает verifyReleaseSigning в
      # app/build.gradle.kts. Gradle зовёт нативные скрипты с --no-tests,
      # поэтому Rust-гейты не дублируются. ABI-скоуп и суффикс версии приходят
      # от вызывающего: у релиза это все три ABI без суффикса, у беты — один
      # ABI с `-beta.<sha>`.
      - name: Build release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ABIS: ${{ inputs.abis }}
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          set -euo pipefail
          gradle_args=(:app:assembleRelease "-Pcsqtt.abis=$ABIS")
          if [[ -n $SUFFIX ]]; then
            gradle_args+=("-Pcsqtt.versionSuffix=$SUFFIX")
          fi
          ./gradlew "${gradle_args[@]}"

      # Сверка установленных нативных артефактов с промежуточными: ловит
      # подменённый или протухший бинарник до публикации. ABI-скоуп обязателен:
      # у native_client_provenance.sh дефолт — все три ABI, и сборка с одним
      # ABI упала бы на отсутствующем. Серверный бинарник всегда amd64,
      # поэтому server_asset_provenance.sh флага не знает.
      - name: Verify native provenance
        run: |
          set -euo pipefail
          bash scripts/server_asset_provenance.sh verify
          bash scripts/native_client_provenance.sh verify --abis="${{ inputs.abis }}"

      # Сверки ниже работают с копией: артефакт публикуется как каталог, без
      # переименований, которые делает collect-release-assets.sh у вызывающего.
      - name: Stage build outputs
        id: stage
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/build-output"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/apk" "$STAGE/assets"
          cp -f app/build/outputs/apk/release/*.apk "$STAGE/apk/"
          cp -f app/build/generated/assets/csqtt-linux-amd64 "$STAGE/assets/"
          compgen -G "$STAGE/apk/*.apk" > /dev/null || {
            echo "no APK produced in app/build/outputs/apk/release" >&2
            exit 1
          }
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"

      # APK обязан оставаться клиентским: серверный бинарник и deploy.sh
      # публикуются отдельно. Проверяем каждый release-APK, а не только universal:
      # сплиты собираются разными пакетными задачами.
      - name: 'Guard: APK carries no server payload'
        run: |
          set -euo pipefail
          STAGE="${{ steps.stage.outputs.dir }}"
          status=0
          for f in "$STAGE"/apk/*.apk; do
            [[ -f $f ]] || continue
            if unzip -l "$f" | grep -E 'assets/(csqtt-linux-amd64|deploy\.sh)'; then
              echo "unexpected server payload in $f" >&2
              status=1
            fi
            unzip -l "$f" | grep -q 'lib/.*/libclient\.so' || {
              echo "missing libclient.so in $f" >&2
              status=1
            }
          done
          exit "$status"

      # Аргументы собираются циклом по файлам, а не глобом: `--apk DIR/*.apk`
      # развернулся бы в позиционные аргументы (в --apk попал бы только
      # первый), а скрипт отвергает позиционные — то есть упал бы после самой
      # дорогой части прогона.
      - name: Verify APK signatures
        id: signcheck
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_FINGERPRINT: ${{ secrets.ANDROID_KEYSTORE_FINGERPRINT }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          STAGE="${{ steps.stage.outputs.dir }}"
          args=(--keystore "$RUNNER_TEMP/release.keystore" --storepass-env ANDROID_KEYSTORE_PASSWORD \
                --alias "$ANDROID_KEY_ALIAS" --expected-fingerprint "$ANDROID_KEYSTORE_FINGERPRINT")
          for f in "$STAGE"/apk/*.apk; do
            args+=(--apk "$f")
          done
          APKSIGNER="$ANDROID_HOME/build-tools/$BT_VER/apksigner"
          out=$(bash .github/scripts/verify-signing-identity.sh "${args[@]}" --apksigner "$APKSIGNER")
          printf '%s\n' "$out"
          {
            echo "cn=$(sed -n 's/^CN=//p' <<<"$out" | head -n 1)"
            echo "fingerprint=$(sed -n 's/^FINGERPRINT=//p' <<<"$out" | head -n 1)"
          } >> "$GITHUB_OUTPUT"

      # package обязан быть ровно csqtt.quic.amurcanov (без суффикса .debug),
      # а versionName/versionCode — совпадать с ожидаемыми от вызывающего
      # (релиз читает их из файла, бета — из `version-name`).
      # aapt2 берётся из запиненного $BT_VER, а не из PATH.
      - name: Verify APK identity
        run: |
          set -euo pipefail
          export LC_ALL=C
          STAGE="${{ steps.stage.outputs.dir }}"
          AAPT2="$ANDROID_HOME/build-tools/$BT_VER/aapt2"
          EXPECTED_VERSION="${{ steps.version.outputs.version }}"
          EXPECTED_CODE="${{ steps.version.outputs.version-code }}"
          [[ -n $EXPECTED_VERSION && -n $EXPECTED_CODE ]] || {
            echo "build-version.sh did not provide version or version-code" >&2
            exit 1
          }
          found=0
          for f in "$STAGE"/apk/*.apk; do
            [[ -f $f ]] || continue
            found=$((found + 1))
            badging=$("$AAPT2" dump badging "$f")
            pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging" | head -n 1)
            version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -n 1)
            code=$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -n 1)
            [[ $pkg == 'csqtt.quic.amurcanov' ]] || {
              echo "unexpected package '$pkg' in $f (expected csqtt.quic.amurcanov)" >&2
              exit 1
            }
            [[ $version == "$EXPECTED_VERSION" ]] || {
              echo "unexpected versionName '$version' in $f (expected $EXPECTED_VERSION)" >&2
              exit 1
            }
            [[ $code == "$EXPECTED_CODE" ]] || {
              echo "unexpected versionCode '$code' in $f (expected $EXPECTED_CODE)" >&2
              exit 1
            }
            echo "[OK] $f package=$pkg versionName=$version versionCode=$code"
          done
          (( found > 0 )) || {
            echo "no release APK found in $STAGE/apk" >&2
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/build-output
          retention-days: 30
          if-no-files-found: error

      # Keystore живёт только до конца прогона и удаляется всегда — даже если
      # сверка или загрузка артефактов упали.
      - name: Cleanup keystore
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/release.keystore"
