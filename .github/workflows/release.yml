name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing git tag to publish'
        required: true
        type: string
      dry_run:
        description: 'Run all gates and build, but do not publish'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

# Четыре job'а вместо одного:
#   resolve — определяет тег/коммит/версию и запоминает время старта;
#   build   — reusable build.yml собирает, проверяет и публикует артефакт
#             release-assets-<version> (apk/ и assets/);
#   image   — собирает серверный образ из docker/ и публикует его в GHCR;
#   publish — скачивает артефакт, собирает ассеты релиза, пишет note и
#             публикует GitHub Release.
#
# Осознанные отличия от прежнего одного job'а:
#   1. `Checkout release target` больше не нужен при сборке: build.yml чекаутит
#      inputs.ref (полный sha из resolve). В publish тот же `git checkout
#      --detach` остаётся — note читает app/build.gradle.kts и
#      rust-server/main.rs дерева тега.
#   2. `Record start time` переехал в resolve и отдаётся выходом started;
#      длительность в note покрывает весь пайплайн, а не один job.
#   3. Артефакт прогона называется release-assets-<version> (без `v`), а не
#      release-assets-<tag>; внутри — apk/ и assets/, а не готовые CSQTT-*.apk.
#   4. `Collect release assets`, `Generate release note`, dry-run и публикация
#      живут в отдельном job'е publish и берут версию/подпись из выходов build.
#      Поэтому подстановки идут через needs.resolve.outputs.* и
#      needs.build.outputs.* — выходов шагов из resolve/сборки в publish нет.
#   5. Образ в GHCR — отдельный job image, который зависит от build, но не от
#      publish: падение публикации релиза не отменяет образ. Порядок и гейты
#      это не меняет — гейты живут только в build.yml.
jobs:
  resolve:
    name: Resolve release target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      started: ${{ steps.start.outputs.started }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Полная история нужна гейту resolve: origin/main и тег обязаны быть
          # локально, не полагаясь на pre-clone поведение раннера.
          fetch-depth: 0
          persist-credentials: false

      - name: Record start time
        id: start
        run: |
          set -euo pipefail
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'

      - name: Resolve release target
        id: resolve
        # workflow_dispatch-входы не превращаются в INPUT_* автоматически: так
        # бывает только у action'ов (`with:`). Без явного env ручной запуск
        # приходил бы с пустым INPUT_TAG_NAME и падал на «tag name is empty».
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          bash .github/scripts/resolve-release-target.sh

  build:
    name: Build release artifacts
    needs: resolve
    permissions:
      contents: read
    # Reusable workflow: ни runs-on, ни timeout-minutes здесь быть не может —
    # они живут внутри build.yml. version-name и expected-version-code не
    # передаются: релиз читает версию из app/build.gradle.kts, как раньше.
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      abis: arm64-v8a,armeabi-v7a,x86_64
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FINGERPRINT: ${{ secrets.ANDROID_KEYSTORE_FINGERPRINT }}

  # Серверный образ. Зависит от build, но не от publish: образ нужен и тогда,
  # когда публикация релиза упала. Job собирает образ всегда, включая dry-run
  # (сборка — часть репетиции); push гейтится строгим сравнением с 'false',
  # чтобы опечатка в имени выхода не запушила образ случайно.
  image:
    name: Publish server image
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Единственный job с packages: write — без него push в GHCR запрещён.
    # Остальные job'ы остаются на contents: read.
    permissions:
      contents: read
      packages: write
    steps:
      # Dockerfile и entrypoint берутся из дерева релизного коммита, а не из
      # ветки, с которой запущен workflow_dispatch.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/build-output

      # Dockerfile делает `COPY csqtt /usr/local/bin/csqtt` при контексте
      # docker/, поэтому бинарь из assets/ артефакта кладём рядом с ним.
      - name: Stage server binary
        run: |
          set -euo pipefail
          install -m 0755 \
            "$RUNNER_TEMP/build-output/assets/csqtt-linux-amd64" \
            docker/csqtt
          file docker/csqtt

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN, а не отдельный секрет: allowlist секретов не расширяется.
      # Логин нужен только когда будет push; в dry-run образ только собирается.
      - name: Log in to GHCR
        if: needs.resolve.outputs.dry_run == 'false'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # Имя образа — ghcr.io/<owner>/csqtt; github.repository_owner отдаёт
      # владельца в нижнем регистре, как требует GHCR.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ needs.resolve.outputs.dry_run == 'false' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/csqtt:${{ needs.resolve.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/csqtt:latest

  publish:
    name: Publish release
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # При workflow_dispatch github.ref = refs/heads/main, поэтому без этого
      # шага note читала бы app/build.gradle.kts и rust-server/main.rs дерева
      # main, а не дерева коммита тега. Коммит уже есть в локальной истории
      # (checkout с fetch-depth: 0), сеть не нужна.
      - name: Checkout release target
        id: target
        run: |
          set -euo pipefail
          git checkout --detach "${{ needs.resolve.outputs.commit }}"

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/build-output

      - name: Collect release assets
        id: collect
        run: |
          set -euo pipefail
          bash .github/scripts/collect-release-assets.sh \
            --root "$GITHUB_WORKSPACE" \
            --apk-dir "$RUNNER_TEMP/build-output/apk" \
            --assets-dir "$RUNNER_TEMP/build-output/assets" \
            --out "$RUNNER_TEMP/release-assets" \
            --version "${{ needs.build.outputs.version }}"

      - name: Generate release note
        run: |
          set -euo pipefail
          DURATION=$(( $(date +%s) - ${{ needs.resolve.outputs.started }} ))
          # Отпечаток читаем из файла в репозитории — того же, который сверял
          # build.yml тройной сверкой. Через needs.build.outputs его передать
          # нельзя: значение совпадает с секретом ANDROID_KEYSTORE_FINGERPRINT,
          # GitHub маскирует такой выход («Skip output 'fingerprint' since it
          # may contain secret»), и строка «Подпись:» молча исчезла бы.
          FINGERPRINT="$(tr -d '[:space:]:' < scripts/release_signing_fingerprint.txt)"
          bash .github/scripts/release-note.sh \
            --root "$GITHUB_WORKSPACE" \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --commit "${{ needs.resolve.outputs.commit }}" \
            --duration-seconds "$DURATION" \
            --fingerprint "$FINGERPRINT" \
            --signer "${{ needs.build.outputs.signer-cn }}" \
            --out "$RUNNER_TEMP/release-note.md"

      # Репетиция: тот же код публикации, что и в настоящем релизе, но
      # черновик удаляется. Иначе write-путь не выполнялся бы в CI ни разу до
      # первого настоящего релиза.
      # Строгое равенство, а не `!= 'true'`: при опечатке в имени выхода
      # значение пустое, и `!= 'true'` опубликовал бы в dry-run.
      - name: 'Dry run: draft and discard'
        if: needs.resolve.outputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < "$RUNNER_TEMP/release-assets/asset-paths.txt"
          # --asset повторяемый: каждый файл — отдельный флаг. `--asset "${ASSETS[@]}"`
          # отдал бы первый файл как значение, а остальные — позиционными
          # аргументами, которые скрипт отвергает.
          asset_args=()
          for asset in "${ASSETS[@]}"; do
            asset_args+=(--asset "$asset")
          done
          bash .github/scripts/publish-release.sh \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --title "CSQTT ${{ needs.resolve.outputs.version }}" \
            --note-file "$RUNNER_TEMP/release-note.md" \
            "${asset_args[@]}" \
            --dry-run
          printf 'DRY RUN: черновик создан, проверен и удалён; публичного релиза нет.\n'
          printf 'Ассеты остались в артефакте прогона %s:\n' "${{ needs.build.outputs.artifact-name }}"
          cat "$RUNNER_TEMP/release-assets/asset-paths.txt"

      # Строгое равенство, а не `!= 'true'`: при опечатке в имени выхода
      # значение пустое, и `!= 'true'` прошёл бы — то есть опубликовал бы в
      # dry-run.
      - name: Publish release
        if: needs.resolve.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < "$RUNNER_TEMP/release-assets/asset-paths.txt"
          asset_args=()
          for asset in "${ASSETS[@]}"; do
            asset_args+=(--asset "$asset")
          done
          bash .github/scripts/publish-release.sh \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --title "CSQTT ${{ needs.resolve.outputs.version }}" \
            --note-file "$RUNNER_TEMP/release-note.md" \
            "${asset_args[@]}"
